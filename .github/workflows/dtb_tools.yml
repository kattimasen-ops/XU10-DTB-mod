name: Decompile DTB

on: [push, workflow_dispatch]

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      - name: Decompile DTB
        run: |
          # Pfad zu deiner DTB-Datei im Repo
          dtc -I dtb -O dts -o device_tree.dts source_files/original.dtb
          
      - name: Upload DTS as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-dts
          path: device_tree.dts
