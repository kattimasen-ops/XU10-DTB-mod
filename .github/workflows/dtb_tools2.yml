name: R36S DTB - Extract Everything

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  extract:
    name: Extract and Decompile DTB
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. DTC installieren
      # ------------------------------------------------------------
      - name: Install DTC
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

          echo "DTC:"
          dtc --version


      # ------------------------------------------------------------
      # 3. DTB suchen
      # ------------------------------------------------------------
      - name: Find DTB
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "DTB files:"
          find . -type f -name "*.dtb" -print

          echo ""

          if [ ! -f "rk3326-r36s-type5-linux.dtb" ]; then
            echo "ERROR: rk3326-r36s-type5-linux.dtb not found!"
            exit 1
          fi

          echo "DTB FOUND:"
          ls -lh rk3326-r36s-type5-linux.dtb


      # ------------------------------------------------------------
      # 4. Arbeitsordner
      # ------------------------------------------------------------
      - name: Create Output Directory
        run: |
          rm -rf r36s_dtb_extraction
          mkdir -p r36s_dtb_extraction

          echo "Output directory created."


      # ------------------------------------------------------------
      # 5. Original DTB sichern
      # ------------------------------------------------------------
      - name: Copy Original DTB
        run: |
          cp \
            rk3326-r36s-type5-linux.dtb \
            r36s_dtb_extraction/rk3326-r36s-type5-linux.dtb

          echo "Original DTB copied."


      # ------------------------------------------------------------
      # 6. KOMPLETTE DTB -> DTS
      # ------------------------------------------------------------
      - name: Decompile DTB
        run: |
          set -e

          echo "Decompiling DTB..."

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o r36s_dtb_extraction/device_tree.dts \
            rk3326-r36s-type5-linux.dtb

          echo ""
          echo "SUCCESS"

          ls -lh \
            r36s_dtb_extraction/device_tree.dts

          echo ""
          echo "Lines:"
          wc -l \
            r36s_dtb_extraction/device_tree.dts


      # ------------------------------------------------------------
      # 7. Zweite DTS-Version ohne Symbols
      # ------------------------------------------------------------
      - name: Create Plain DTS
        run: |
          dtc \
            -I dtb \
            -O dts \
            -o r36s_dtb_extraction/device_tree_plain.dts \
            rk3326-r36s-type5-linux.dtb


      # ------------------------------------------------------------
      # 8. DTS mit Symbols
      # ------------------------------------------------------------
      - name: Create DTS With Symbols
        run: |
          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o r36s_dtb_extraction/device_tree_symbols.dts \
            rk3326-r36s-type5-linux.dtb


      # ------------------------------------------------------------
      # 9. DTB Header
      # ------------------------------------------------------------
      - name: Extract DTB Header
        run: |
          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          magic = header[0]
          totalsize = header[1]
          off_struct = header[2]
          off_strings = header[3]
          off_reserve = header[4]
          version = header[5]
          last_version = header[6]
          boot_cpu = header[7]
          size_strings = header[8]
          size_struct = header[9]

          filesize = os.path.getsize(filename)

          with open(
              "r36s_dtb_extraction/dtb_header.txt",
              "w"
          ) as f:

              f.write("R36S DTB HEADER\n")
              f.write("================\n\n")
              f.write(f"Magic:              0x{magic:08x}\n")
              f.write(f"Total size:         {totalsize}\n")
              f.write(f"Structure offset:   0x{off_struct:08x}\n")
              f.write(f"Strings offset:     0x{off_strings:08x}\n")
              f.write(f"Reserve map offset: 0x{off_reserve:08x}\n")
              f.write(f"Version:            {version}\n")
              f.write(f"Last version:       {last_version}\n")
              f.write(f"Boot CPU:           {boot_cpu}\n")
              f.write(f"Strings size:       {size_strings}\n")
              f.write(f"Structure size:     {size_struct}\n")
              f.write(f"File size:          {filesize}\n")

          print("Header extracted.")
          PY


      # ------------------------------------------------------------
      # 10. Strings
      # ------------------------------------------------------------
      - name: Extract Strings
        run: |
          strings \
            -a \
            rk3326-r36s-type5-linux.dtb \
            > r36s_dtb_extraction/dtb_strings.txt


      # ------------------------------------------------------------
      # 11. Vollständiger Hexdump
      # ------------------------------------------------------------
      - name: Extract Complete Hex
        run: |
          xxd \
            -g 1 \
            rk3326-r36s-type5-linux.dtb \
            > r36s_dtb_extraction/dtb_complete_hex.txt


      # ------------------------------------------------------------
      # 12. Structure + Strings Block
      # ------------------------------------------------------------
      - name: Extract DTB Binary Blocks
        run: |
          python3 <<'PY'
          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_struct = header[2]
          off_strings = header[3]

          size_strings = header[8]
          size_struct = header[9]

          structure = data[
              off_struct:
              off_struct + size_struct
          ]

          strings_block = data[
              off_strings:
              off_strings + size_strings
          ]

          with open(
              "r36s_dtb_extraction/dt_structure.bin",
              "wb"
          ) as f:
              f.write(structure)

          with open(
              "r36s_dtb_extraction/dt_strings.bin",
              "wb"
          ) as f:
              f.write(strings_block)

          print("Structure:", len(structure), "bytes")
          print("Strings:", len(strings_block), "bytes")
          PY


      # ------------------------------------------------------------
      # 13. Binary Blocks als Hex
      # ------------------------------------------------------------
      - name: Hexdump DTB Blocks
        run: |
          xxd \
            -g 1 \
            r36s_dtb_extraction/dt_structure.bin \
            > r36s_dtb_extraction/dt_structure_hex.txt

          xxd \
            -g 1 \
            r36s_dtb_extraction/dt_strings.bin \
            > r36s_dtb_extraction/dt_strings_hex.txt


      # ------------------------------------------------------------
      # 14. Hardware-Informationen
      # ------------------------------------------------------------
      - name: Search Hardware
        run: |
          set +e

          grep -Ein \
            "gpio|adc|joystick|joy|analog|axis|axes|button|key|input|pinctrl|rk3326" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/hardware_search.txt

          true


      # ------------------------------------------------------------
      # 15. FN Button
      # ------------------------------------------------------------
      - name: Search FN Button
        run: |
          set +e

          {
            echo "===== FN / FUNCTION ====="
            grep -Ein \
              "fn|function|func" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== GPIO KEYS ====="
            grep -Ein \
              "gpio-keys|gpio-key|linux,code|keycode" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== ADC KEYS ====="
            grep -Ein \
              "adc-keys|io-channels|io-channel" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== MENU / HOTKEY ====="
            grep -Ein \
              "menu|hotkey" \
              r36s_dtb_extraction/device_tree.dts
          } > r36s_dtb_extraction/fn_button_search.txt

          true


      # ------------------------------------------------------------
      # 16. Analogstick
      # ------------------------------------------------------------
      - name: Search Analog Stick
        run: |
          set +e

          {
            echo "===== JOYSTICK / ANALOG ====="
            grep -Ein \
              "joystick|joy|analog|axis|axes|x-axis|y-axis" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== ADC ====="
            grep -Ein \
              "adc|adc@|adc-" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== INPUT ====="
            grep -Ein \
              "input|input-device|linux,input" \
              r36s_dtb_extraction/device_tree.dts
          } > r36s_dtb_extraction/analog_stick_search.txt

          true


      # ------------------------------------------------------------
      # 17. Inversion / Polarity
      # ------------------------------------------------------------
      - name: Search Axis Inversion
        run: |
          set +e

          grep -Ein \
            "invert|inverted|polarity|active-low|active-high|axis|axes" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/polarity_and_axis_search.txt

          true


      # ------------------------------------------------------------
      # 18. GPIO
      # ------------------------------------------------------------
      - name: Extract GPIO Information
        run: |
          set +e

          grep -Ein \
            "gpio" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_gpio.txt

          true


      # ------------------------------------------------------------
      # 19. ADC
      # ------------------------------------------------------------
      - name: Extract ADC Information
        run: |
          set +e

          grep -Ein \
            "adc" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_adc.txt

          true


      # ------------------------------------------------------------
      # 20. Input / Keys
      # ------------------------------------------------------------
      - name: Extract Input Information
        run: |
          set +e

          grep -Ein \
            "input|key|button|event" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_input.txt

          true


      # ------------------------------------------------------------
      # 21. Compatible Devices
      # ------------------------------------------------------------
      - name: Extract Compatible Devices
        run: |
          set +e

          grep -Ein \
            "compatible" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/compatible.txt

          true


      # ------------------------------------------------------------
      # 22. Gesamte Extraktion anzeigen
      # ------------------------------------------------------------
      - name: Show Extraction
        run: |
          echo "========================================"
          echo "ALL EXTRACTED FILES"
          echo "========================================"

          find r36s_dtb_extraction \
            -type f \
            -printf "%p (%s bytes)\n" \
            | sort

          echo ""
          echo "TOTAL:"
          du -sh r36s_dtb_extraction


      # ------------------------------------------------------------
      # 23. ZIP ERSTELLEN
      #
      # Dieser Schritt läuft IMMER.
      # ------------------------------------------------------------
      - name: Create ZIP
        if: always()
        run: |
          set -e

          echo "========================================"
          echo "CREATING FINAL ZIP"
          echo "========================================"

          if [ ! -d "r36s_dtb_extraction" ]; then
            echo "Output directory does not exist."
            exit 1
          fi

          rm -f r36s-complete-dtb-extraction.zip

          zip \
            -r \
            r36s-complete-dtb-extraction.zip \
            r36s_dtb_extraction

          echo ""
          echo "ZIP CREATED:"
          ls -lh r36s-complete-dtb-extraction.zip

          echo ""
          echo "ZIP CONTENT:"
          unzip -l r36s-complete-dtb-extraction.zip


      # ------------------------------------------------------------
      # 24. ZIP testen
      # ------------------------------------------------------------
      - name: Test ZIP
        if: always()
        run: |
          if [ -f "r36s-complete-dtb-extraction.zip" ]; then

            echo "ZIP exists."

            unzip -t \
              r36s-complete-dtb-extraction.zip

            echo ""
            echo "ZIP TEST SUCCESS."

          else

            echo "ERROR: ZIP does not exist!"
            exit 1

          fi


      # ------------------------------------------------------------
      # 25. ARTIFACT HOCHLADEN
      #
      # WICHTIG:
      # Dieser Schritt wird IMMER ausgeführt.
      # ------------------------------------------------------------
      - name: Upload ZIP Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R36S-DTB-COMPLETE
          path: r36s-complete-dtb-extraction.zip
          if-no-files-found: error
          retention-days: 30
