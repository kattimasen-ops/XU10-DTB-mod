
name: Decompile and Extract R36S DTB

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Repository auschecken
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Device Tree Compiler installieren
      # ============================================================
      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

          echo "DTC Version:"
          dtc --version


      # ============================================================
      # 3. DTB prüfen
      # ============================================================
      - name: Verify DTB
        run: |
          set -e

          DTB="rk3326-r36s-type5-linux.dtb"

          echo "Suche nach:"
          echo "$DTB"

          if [ ! -f "$DTB" ]; then
            echo ""
            echo "FEHLER: DTB nicht gefunden!"
            echo ""
            echo "Gefundene DTB Dateien:"
            find . -type f \( -name "*.dtb" -o -name "*.dtbo" \) -print
            exit 1
          fi

          echo ""
          echo "DTB gefunden:"
          ls -lh "$DTB"

          echo ""
          echo "Dateityp:"
          file "$DTB"


      # ============================================================
      # 4. Extraction-Verzeichnis erstellen
      # ============================================================
      - name: Create Extraction Directory
        run: |
          set -e

          rm -rf dtb_extraction
          rm -f r36s-complete-dtb-extraction.zip

          mkdir -p dtb_extraction

          echo "Extraction directory created."


      # ============================================================
      # 5. Original-DTB sichern
      # ============================================================
      - name: Copy Original DTB
        run: |
          set -e

          cp \
            rk3326-r36s-type5-linux.dtb \
            dtb_extraction/rk3326-r36s-type5-linux.original.dtb

          echo "Original DTB copied."


      # ============================================================
      # 6. DTB Header analysieren
      # ============================================================
      - name: Analyze DTB Header
        run: |
          set -e

          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              header = f.read(40)

          if len(header) < 40:
              raise SystemExit("DTB Header ist zu kurz.")

          (
              magic,
              totalsize,
              off_dt_struct,
              off_dt_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_dt_strings,
              size_dt_struct
          ) = struct.unpack(">10I", header)

          filesize = os.path.getsize(filename)

          structure_end = off_dt_struct + size_dt_struct
          strings_end = off_dt_strings + size_dt_strings

          trailing = filesize - totalsize

          print("========================================")
          print("DTB HEADER")
          print("========================================")
          print(f"Magic              : 0x{magic:08x}")
          print(f"Total Size         : {totalsize} bytes")
          print(f"Structure Offset   : 0x{off_dt_struct:08x}")
          print(f"Strings Offset     : 0x{off_dt_strings:08x}")
          print(f"Reserve Map Offset : 0x{off_mem_rsvmap:08x}")
          print(f"Version            : {version}")
          print(f"Last Compatible    : {last_comp_version}")
          print(f"Boot CPU           : {boot_cpuid_phys}")
          print(f"Strings Size       : {size_dt_strings} bytes")
          print(f"Structure Size     : {size_dt_struct} bytes")
          print(f"File Size          : {filesize} bytes")
          print(f"Structure End      : 0x{structure_end:08x}")
          print(f"Strings End        : 0x{strings_end:08x}")
          print(f"Trailing Data      : {trailing} bytes")

          if magic != 0xd00dfeed:
              raise SystemExit(
                  f"Ungültige DTB Magic: 0x{magic:08x}"
              )

          with open(
              "dtb_extraction/dtb_header.txt",
              "w"
          ) as out:

              out.write("DTB HEADER\n")
              out.write("==========\n\n")
              out.write(f"Magic: 0x{magic:08x}\n")
              out.write(f"Total Size: {totalsize}\n")
              out.write(
                  f"Structure Offset: 0x{off_dt_struct:08x}\n"
              )
              out.write(
                  f"Strings Offset: 0x{off_dt_strings:08x}\n"
              )
              out.write(
                  f"Reserve Map Offset: 0x{off_mem_rsvmap:08x}\n"
              )
              out.write(f"Version: {version}\n")
              out.write(
                  f"Last Compatible: {last_comp_version}\n"
              )
              out.write(
                  f"Boot CPU: {boot_cpuid_phys}\n"
              )
              out.write(
                  f"Strings Size: {size_dt_strings}\n"
              )
              out.write(
                  f"Structure Size: {size_dt_struct}\n"
              )
              out.write(f"File Size: {filesize}\n")
              out.write(
                  f"Structure End: 0x{structure_end:08x}\n"
              )
              out.write(
                  f"Strings End: 0x{strings_end:08x}\n"
              )
              out.write(
                  f"Trailing Data: {trailing}\n"
              )

          PY


      # ============================================================
      # 7. Memory Reserve Map
      # ============================================================
      - name: Extract Memory Reserve Map
        run: |
          set -e

          python3 <<'PY' > dtb_extraction/memory_reserve_map.txt

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_mem_rsvmap = header[4]

          print("DEVICE TREE MEMORY RESERVE MAP")
          print("==============================")
          print()
          print(
              f"Offset: 0x{off_mem_rsvmap:08x}"
          )
          print()

          offset = off_mem_rsvmap
          index = 0

          while offset + 16 <= len(data):

              address, size = struct.unpack(
                  ">QQ",
                  data[offset:offset + 16]
              )

              if address == 0 and size == 0:
                  print("End of reserve map.")
                  break

              print(
                  f"[{index}] "
                  f"address=0x{address:016x} "
                  f"size=0x{size:016x} "
                  f"({size} bytes)"
              )

              offset += 16
              index += 1

          if index == 0:
              print(
                  "Keine reservierten Bereiche gefunden."
              )

          PY


      # ============================================================
      # 8. KOMPLETTE DTB DEKOMPILIEREN
      # ============================================================
      - name: Decompile Complete DTB
        run: |
          set -e

          echo "========================================"
          echo "DECOMPILING COMPLETE DTB"
          echo "========================================"

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o device_tree.dts \
            rk3326-r36s-type5-linux.dtb

          echo ""
          echo "Dekomplilierung erfolgreich."

          echo ""
          echo "DTS Größe:"
          ls -lh device_tree.dts

          echo ""
          echo "DTS Zeilen:"
          wc -l device_tree.dts


      # ============================================================
      # 9. DTS kopieren
      # ============================================================
      - name: Save Decompiled DTS
        run: |
          set -e

          cp \
            device_tree.dts \
            dtb_extraction/device_tree.dts


      # ============================================================
      # 10. Plain DTS
      # ============================================================
      - name: Create Plain DTS
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -o dtb_extraction/device_tree_plain.dts \
            rk3326-r36s-type5-linux.dtb


      # ============================================================
      # 11. DTS mit Symbols
      # ============================================================
      - name: Create Symbol DTS
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o dtb_extraction/device_tree_symbols.dts \
            rk3326-r36s-type5-linux.dtb


      # ============================================================
      # 12. Strings
      # ============================================================
      - name: Extract DTB Strings
        run: |
          set -e

          strings \
            -a \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_strings.txt


      # ============================================================
      # 13. Kompletter Hexdump
      # ============================================================
      - name: Create Complete Hex Dump
        run: |
          set -e

          xxd \
            -g 1 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_complete_hex.txt


      # ============================================================
      # 14. Header Hexdump
      # ============================================================
      - name: Create Header Hex Dump
        run: |
          set -e

          xxd \
            -g 1 \
            -l 64 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_header_hex.txt


      # ============================================================
      # 15. Structure Block extrahieren
      # ============================================================
      - name: Extract DT Structure Block
        run: |
          set -e

          python3 <<'PY'

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_dt_struct = header[2]
          size_dt_struct = header[9]

          structure = data[
              off_dt_struct:
              off_dt_struct + size_dt_struct
          ]

          with open(
              "dtb_extraction/dt_structure.bin",
              "wb"
          ) as f:
              f.write(structure)

          print(
              "Structure Block:",
              len(structure),
              "bytes"
          )

          PY


      # ============================================================
      # 16. Strings Block extrahieren
      # ============================================================
      - name: Extract DT Strings Block
        run: |
          set -e

          python3 <<'PY'

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_dt_strings = header[3]
          size_dt_strings = header[8]

          strings_block = data[
              off_dt_strings:
              off_dt_strings + size_dt_strings
          ]

          with open(
              "dtb_extraction/dt_strings.bin",
              "wb"
          ) as f:
              f.write(strings_block)

          print(
              "Strings Block:",
              len(strings_block),
              "bytes"
          )

          PY


      # ============================================================
      # 17. Structure Hexdump
      # ============================================================
      - name: Dump DT Structure
        run: |
          set -e

          xxd \
            -g 1 \
            dtb_extraction/dt_structure.bin \
            > dtb_extraction/dt_structure_hex.txt


      # ============================================================
      # 18. Strings Hexdump
      # ============================================================
      - name: Dump DT Strings
        run: |
          set -e

          xxd \
            -g 1 \
            dtb_extraction/dt_strings.bin \
            > dtb_extraction/dt_strings_hex.txt


      # ============================================================
      # 19. Hardware Suche
      # ============================================================
      - name: Search Hardware Nodes
        run: |
          set +e

          echo "HARDWARE SEARCH" \
            > dtb_extraction/hardware_search.txt

          echo "================" \
            >> dtb_extraction/hardware_search.txt

          grep -Ein \
            "gpio|adc|joystick|joy|analog|key|keys|button|input|pinctrl|rk3326" \
            device_tree.dts \
            >> dtb_extraction/hardware_search.txt

          true


      # ============================================================
      # 20. FN Button Suche
      # ============================================================
      - name: Search FN Button
        run: |
          set +e

          echo "FN BUTTON SEARCH" \
            > dtb_extraction/fn_button_search.txt

          echo "================" \
            >> dtb_extraction/fn_button_search.txt

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "FN / FUNCTION / MENU:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "fn|function|func|menu|hotkey" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "GPIO KEYS:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "gpio-keys|gpio-key|linux,code|keycode" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "ADC KEYS:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "adc-keys|io-channels|io-channel|adc" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt

          true


      # ============================================================
      # 21. Analogstick Suche
      # ============================================================
      - name: Search Analog Stick
        run: |
          set +e

          echo "ANALOG STICK SEARCH" \
            > dtb_extraction/analog_stick_search.txt

          echo "===================" \
            >> dtb_extraction/analog_stick_search.txt

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "JOYSTICK / ANALOG / AXIS:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "joystick|joy|analog|axis|axes|x-axis|y-axis" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "ADC:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "adc|adc@|adc-" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "INPUT:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "input|input-device|linux,input" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt

          true


      # ============================================================
      # 22. Polarity / Inversion
      # ============================================================
      - name: Search Polarity And Inversion
        run: |
          set +e

          echo "POLARITY / INVERSION SEARCH" \
            > dtb_extraction/polarity_search.txt

          echo "============================" \
            >> dtb_extraction/polarity_search.txt

          grep -Ein \
            "invert|inverted|polarity|active-low|active-high|axis" \
            device_tree.dts \
            >> dtb_extraction/polarity_search.txt

          true


      # ============================================================
      # 23. Alle GPIO Einträge
      # ============================================================
      - name: Extract GPIO Entries
        run: |
          set +e

          grep -Ein \
            "gpio" \
            device_tree.dts \
            > dtb_extraction/all_gpio_entries.txt

          true


      # ============================================================
      # 24. Alle ADC Einträge
      # ============================================================
      - name: Extract ADC Entries
        run: |
          set +e

          grep -Ein \
            "adc" \
            device_tree.dts \
            > dtb_extraction/all_adc_entries.txt

          true


      # ============================================================
      # 25. Alle Input Einträge
      # ============================================================
      - name: Extract Input Entries
        run: |
          set +e

          grep -Ein \
            "input|key|button|event" \
            device_tree.dts \
            > dtb_extraction/all_input_entries.txt

          true


      # ============================================================
      # 26. Compatible Devices
      # ============================================================
      - name: Extract Compatible Devices
        run: |
          set +e

          grep -Ein \
            "compatible" \
            device_tree.dts \
            > dtb_extraction/compatible_devices.txt

          true


      # ============================================================
      # 27. Padding analysieren
      # ============================================================
      - name: Analyze DTB Padding
        run: |
          set -e

          python3 <<'PY' > dtb_extraction/padding_analysis.txt

          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          totalsize = header[1]
          off_dt_struct = header[2]
          off_dt_strings = header[3]
          size_dt_strings = header[8]
          size_dt_struct = header[9]

          filesize = os.path.getsize(filename)

          structure_end = (
              off_dt_struct +
              size_dt_struct
          )

          strings_end = (
              off_dt_strings +
              size_dt_strings
          )

          used_end = max(
              structure_end,
              strings_end
          )

          padding = totalsize - used_end
          trailing = filesize - totalsize

          print("DTB PADDING ANALYSIS")
          print("====================")
          print()
          print(f"File size: {filesize} bytes")
          print(f"DTB totalsize: {totalsize} bytes")
          print(f"Structure end: 0x{structure_end:x}")
          print(f"Strings end: 0x{strings_end:x}")
  
