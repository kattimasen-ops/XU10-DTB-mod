```yaml
name: R36S DTB Extract and Decompile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler zip xxd

          echo "DTC version:"
          dtc --version

      - name: Check DTB
        run: |
          set -e

          DTB="rk3326-r36s-type5-linux.dtb"

          if [ ! -f "$DTB" ]; then
            echo "ERROR: $DTB was not found."
            echo ""
            echo "DTB files found in repository:"
            find . -type f -name "*.dtb" -print
            exit 1
          fi

          echo "DTB found:"
          ls -lh "$DTB"

      - name: Create output directory
        run: |
          set -e

          rm -rf r36s_dtb_extraction
          rm -f r36s-complete-dtb-extraction.zip

          mkdir -p r36s_dtb_extraction

      - name: Copy original DTB
        run: |
          set -e

          cp \
            rk3326-r36s-type5-linux.dtb \
            r36s_dtb_extraction/rk3326-r36s-type5-linux.original.dtb

      - name: Decompile complete DTB
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o r36s_dtb_extraction/device_tree.dts \
            rk3326-r36s-type5-linux.dtb

          echo "Decompilation successful:"
          ls -lh r36s_dtb_extraction/device_tree.dts

      - name: Create plain DTS
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -o r36s_dtb_extraction/device_tree_plain.dts \
            rk3326-r36s-type5-linux.dtb

      - name: Extract DTB header
        run: |
          set -e

          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              header = f.read(40)

          if len(header) != 40:
              raise SystemExit("Invalid DTB header.")

          (
              magic,
              totalsize,
              off_struct,
              off_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_strings,
              size_struct
          ) = struct.unpack(">10I", header)

          filesize = os.path.getsize(filename)

          with open(
              "r36s_dtb_extraction/dtb_header.txt",
              "w"
          ) as out:

              out.write("R36S DTB HEADER\n")
              out.write("================\n\n")
              out.write(f"Magic              : 0x{magic:08x}\n")
              out.write(f"Total size         : {totalsize}\n")
              out.write(f"Structure offset   : 0x{off_struct:08x}\n")
              out.write(f"Strings offset     : 0x{off_strings:08x}\n")
              out.write(f"Reserve map offset : 0x{off_mem_rsvmap:08x}\n")
              out.write(f"Version            : {version}\n")
              out.write(f"Last compatible    : {last_comp_version}\n")
              out.write(f"Boot CPU           : {boot_cpuid_phys}\n")
              out.write(f"Strings size       : {size_strings}\n")
              out.write(f"Structure size     : {size_struct}\n")
              out.write(f"File size          : {filesize}\n")

          if magic != 0xD00DFEED:
              raise SystemExit(
                  f"Invalid DTB magic: 0x{magic:08x}"
              )

          print("Valid DTB.")
          PY

      - name: Extract DTB strings
        run: |
          set -e

          strings \
            -a \
            rk3326-r36s-type5-linux.dtb \
            > r36s_dtb_extraction/dtb_strings.txt

      - name: Create complete hex dump
        run: |
          set -e

          xxd \
            -g 1 \
            rk3326-r36s-type5-linux.dtb \
            > r36s_dtb_extraction/dtb_complete_hex.txt

      - name: Extract DT structure and strings blocks
        run: |
          set -e

          python3 <<'PY'
          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          if len(data) < 40:
              raise SystemExit("DTB is too small.")

          header = struct.unpack(">10I", data[:40])

          off_struct = header[2]
          off_strings = header[3]
          size_strings = header[8]
          size_struct = header[9]

          structure_end = off_struct + size_struct
          strings_end = off_strings + size_strings

          if structure_end > len(data):
              raise SystemExit("Structure block exceeds DTB size.")

          if strings_end > len(data):
              raise SystemExit("Strings block exceeds DTB size.")

          with open(
              "r36s_dtb_extraction/dt_structure.bin",
              "wb"
          ) as f:
              f.write(data[off_struct:structure_end])

          with open(
              "r36s_dtb_extraction/dt_strings.bin",
              "wb"
          ) as f:
              f.write(data[off_strings:strings_end])

          print(f"Structure block: {size_struct} bytes")
          print(f"Strings block:   {size_strings} bytes")
          PY

      - name: Hex dump binary blocks
        run: |
          set -e

          xxd \
            -g 1 \
            r36s_dtb_extraction/dt_structure.bin \
            > r36s_dtb_extraction/dt_structure_hex.txt

          xxd \
            -g 1 \
            r36s_dtb_extraction/dt_strings.bin \
            > r36s_dtb_extraction/dt_strings_hex.txt

      - name: Analyze DTB padding
        run: |
          set -e

          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          (
              magic,
              totalsize,
              off_struct,
              off_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_strings,
              size_struct
          ) = struct.unpack(">10I", data[:40])

          filesize = os.path.getsize(filename)

          structure_end = off_struct + size_struct
          strings_end = off_strings + size_strings
          used_end = max(structure_end, strings_end)

          padding = totalsize - used_end
          trailing = filesize - totalsize

          with open(
              "r36s_dtb_extraction/padding_analysis.txt",
              "w"
          ) as out:

              out.write("DTB PADDING ANALYSIS\n")
              out.write("====================\n\n")
              out.write(f"File size       : {filesize}\n")
              out.write(f"DTB total size  : {totalsize}\n")
              out.write(f"Structure end   : 0x{structure_end:x}\n")
              out.write(f"Strings end     : 0x{strings_end:x}\n")
              out.write(f"Used end        : 0x{used_end:x}\n")
              out.write(f"DTB padding     : {padding}\n")
              out.write(f"Trailing data   : {trailing}\n")

              if padding > 0:
                  rounded = ((padding + 255) // 256) * 256
                  out.write(
                      f"Rounded padding : {rounded}\n"
                  )

          print(f"DTB padding: {padding} bytes")
          print(f"Trailing data: {trailing} bytes")
          PY

      - name: Search hardware information
        run: |
          set +e

          grep -Ein \
            "gpio|adc|joystick|joy|analog|axis|axes|button|key|input|pinctrl|rk3326" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/hardware_search.txt

          true

      - name: Search FN button
        run: |
          set +e

          {
            echo "===== FN / FUNCTION ====="
            grep -Ein \
              "fn|function|func" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== GPIO KEYS ====="
            grep -Ein \
              "gpio-keys|gpio-key|linux,code|keycode" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== ADC KEYS ====="
            grep -Ein \
              "adc-keys|io-channels|io-channel" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== MENU / HOTKEY ====="
            grep -Ein \
              "menu|hotkey" \
              r36s_dtb_extraction/device_tree.dts
          } > r36s_dtb_extraction/fn_button_search.txt

          true

      - name: Search analog stick
        run: |
          set +e

          {
            echo "===== JOYSTICK / ANALOG ====="
            grep -Ein \
              "joystick|joy|analog|axis|axes|x-axis|y-axis" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== ADC ====="
            grep -Ein \
              "adc|adc@|adc-" \
              r36s_dtb_extraction/device_tree.dts

            echo ""
            echo "===== INPUT ====="
            grep -Ein \
              "input|input-device|linux,input" \
              r36s_dtb_extraction/device_tree.dts
          } > r36s_dtb_extraction/analog_stick_search.txt

          true

      - name: Search inversion and polarity
        run: |
          set +e

          grep -Ein \
            "invert|inverted|polarity|active-low|active-high|axis|axes" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/polarity_and_axis_search.txt

          true

      - name: Extract GPIO entries
        run: |
          set +e

          grep -Ein \
            "gpio" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_gpio.txt

          true

      - name: Extract ADC entries
        run: |
          set +e

          grep -Ein \
            "adc" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_adc.txt

          true

      - name: Extract input entries
        run: |
          set +e

          grep -Ein \
            "input|key|button|event" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/all_input.txt

          true

      - name: Extract compatible entries
        run: |
          set +e

          grep -Ein \
            "compatible" \
            r36s_dtb_extraction/device_tree.dts \
            > r36s_dtb_extraction/compatible.txt

          true

      - name: Create extraction report
        run: |
          set -e

          {
            echo "R36S DTB EXTRACTION"
            echo "=================="
            echo ""
            echo "Original DTB:"
            ls -lh rk3326-r36s-type5-linux.dtb
            echo ""
            echo "Extracted files:"
            find r36s_dtb_extraction -type f -printf "%p - %s bytes\n" | sort
            echo ""
            echo "Total extraction size:"
            du -sh r36s_dtb_extraction
          } > r36s_dtb_extraction/README.txt

      - name: Show extracted files
        run: |
          echo "========================================"
          echo "EXTRACTED FILES"
          echo "========================================"

          find r36s_dtb_extraction \
            -type f \
            -printf "%p (%s bytes)\n" \
            | sort

      - name: Create ZIP
        if: always()
        run: |
          set -e

          if [ ! -d "r36s_dtb_extraction" ]; then
            echo "ERROR: extraction directory does not exist."
            exit 1
          fi

          rm -f r36s-complete-dtb-extraction.zip

          zip \
            -r \
            r36s-complete-dtb-extraction.zip \
            r36s_dtb_extraction

          echo ""
          echo "ZIP CREATED:"
          ls -lh r36s-complete-dtb-extraction.zip

      - name: Verify ZIP
        if: always()
        run: |
          set -e

          if [ ! -f "r36s-complete-dtb-extraction.zip" ]; then
            echo "ERROR: ZIP was not created."
            exit 1
          fi

          unzip -t r36s-complete-dtb-extraction.zip

          echo ""
          echo "ZIP verification successful."

      - name: Upload ZIP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R36S-DTB-COMPLETE
          path: r36s-complete-dtb-extraction.zip
          if-no-files-found: error
          retention-days: 30
```
