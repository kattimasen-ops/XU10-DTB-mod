name: Decompile and Extract R36S DTB

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Repository auschecken
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Device Tree Compiler installieren
      # ============================================================
      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            binutils \
            xxd \
            file \
            zip

          echo "=========================================="
          echo "Device Tree Compiler"
          echo "=========================================="
          dtc --version

          echo
          echo "=========================================="
          echo "System"
          echo "=========================================="
          uname -a


      # ============================================================
      # 3. Repository und DTB prüfen
      # ============================================================
      - name: Verify Repository and DTB
        run: |
          set -e

          echo "=========================================="
          echo "Repository"
          echo "=========================================="

          pwd

          echo
          echo "Dateien im Repository:"
          find . -maxdepth 3 -type f -print | sort

          echo
          echo "=========================================="
          echo "Gesuchte DTB"
          echo "=========================================="

          DTB="rk3326-r36s-type5-linux.dtb"

          if [ ! -f "$DTB" ]; then
            echo
            echo "FEHLER:"
            echo "$DTB wurde nicht gefunden!"
            echo
            echo "Gefundene DTB-Dateien:"
            find . -type f \( -name "*.dtb" -o -name "*.dtbo" \) -print
            exit 1
          fi

          echo "DTB gefunden:"
          ls -lah "$DTB"

          echo
          echo "Dateityp:"
          file "$DTB"


      # ============================================================
      # 4. Extraktionsverzeichnis vorbereiten
      # ============================================================
      - name: Prepare Extraction Directory
        run: |
          set -e

          rm -rf dtb_extraction
          mkdir -p dtb_extraction

          echo "Extraktionsverzeichnis erstellt."


      # ============================================================
      # 5. Original-DTB sichern
      # ============================================================
      - name: Save Original DTB
        run: |
          set -e

          cp \
            rk3326-r36s-type5-linux.dtb \
            dtb_extraction/rk3326-r36s-type5-linux.original.dtb

          echo "Original-DTB gesichert."

          ls -lh \
            dtb_extraction/rk3326-r36s-type5-linux.original.dtb


      # ============================================================
      # 6. DTB Header vollständig auslesen
      # ============================================================
      - name: Analyze DTB Header
        run: |
          set -e

          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"
          output = "dtb_extraction/dtb_header.txt"

          filesize = os.path.getsize(filename)

          with open(filename, "rb") as f:
              header = f.read(40)

          if len(header) < 40:
              raise SystemExit("DTB ist kleiner als der erwartete Header.")

          (
              magic,
              totalsize,
              off_dt_struct,
              off_dt_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_dt_strings,
              size_dt_struct
          ) = struct.unpack(">10I", header)

          print("==================================================")
          print("DEVICE TREE BLOB HEADER")
          print("==================================================")
          print()
          print(f"Datei              : {filename}")
          print(f"Dateigröße         : {filesize} Bytes")
          print()
          print(f"Magic              : 0x{magic:08x}")
          print(f"Total Size         : {totalsize} Bytes")
          print(f"Structure Offset   : 0x{off_dt_struct:08x}")
          print(f"Strings Offset     : 0x{off_dt_strings:08x}")
          print(f"Reserve Map Offset : 0x{off_mem_rsvmap:08x}")
          print(f"Version            : {version}")
          print(f"Last Compatible    : {last_comp_version}")
          print(f"Boot CPU           : {boot_cpuid_phys}")
          print(f"Strings Size       : {size_dt_strings} Bytes")
          print(f"Structure Size     : {size_dt_struct} Bytes")
          print()

          if magic != 0xd00dfeed:
              print("FEHLER: Ungültige DTB Magic!")
              print(f"Erwartet: 0xd00dfeed")
              print(f"Gefunden: 0x{magic:08x}")
              raise SystemExit(1)

          print("DTB Magic: OK")
          print()

          structure_end = off_dt_struct + size_dt_struct
          strings_end = off_dt_strings + size_dt_strings

          print("==================================================")
          print("BEREICHE")
          print("==================================================")
          print()
          print(
              f"Memory Reserve Map : 0x{off_mem_rsvmap:08x}"
          )
          print(
              f"DT Structure       : 0x{off_dt_struct:08x}"
              f" - 0x{structure_end:08x}"
          )
          print(
              f"DT Strings         : 0x{off_dt_strings:08x}"
              f" - 0x{strings_end:08x}"
          )
          print()

          trailing = filesize - totalsize

          print("==================================================")
          print("PADDING / TRAILING DATA")
          print("==================================================")
          print()
          print(f"DTB totalsize      : {totalsize} Bytes")
          print(f"Dateigröße         : {filesize} Bytes")
          print(f"Trailing Data      : {trailing} Bytes")
          print()

          if trailing > 0:
              print(
                  "Die Datei enthält Daten hinter dem offiziellen "
                  "DTB-Bereich."
              )
          else:
              print("Keine zusätzlichen Daten hinter der DTB.")

          with open(output, "w") as out:
              out.write("DTB Header analysis generated by GitHub Actions\n")
              out.write("\n")
              out.write(f"Magic: 0x{magic:08x}\n")
              out.write(f"Total size: {totalsize}\n")
              out.write(f"Structure offset: 0x{off_dt_struct:x}\n")
              out.write(f"Strings offset: 0x{off_dt_strings:x}\n")
              out.write(f"Reserve map offset: 0x{off_mem_rsvmap:x}\n")
              out.write(f"Version: {version}\n")
              out.write(f"Last compatible version: {last_comp_version}\n")
              out.write(f"Boot CPU: {boot_cpuid_phys}\n")
              out.write(f"Strings size: {size_dt_strings}\n")
              out.write(f"Structure size: {size_dt_struct}\n")
              out.write(f"File size: {filesize}\n")
              out.write(f"Trailing data: {trailing}\n")

          PY

          cat dtb_extraction/dtb_header.txt


      # ============================================================
      # 7. Memory Reserve Map extrahieren
      # ============================================================
      - name: Extract Memory Reserve Map
        run: |
          set -e

          python3 <<'PY' > dtb_extraction/memory_reserve_map.txt

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          (
              magic,
              totalsize,
              off_dt_struct,
              off_dt_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_dt_strings,
              size_dt_struct
          ) = struct.unpack(">10I", data[:40])

          print("==================================================")
          print("DEVICE TREE MEMORY RESERVE MAP")
          print("==================================================")
          print()
          print(f"Offset: 0x{off_mem_rsvmap:x}")
          print()

          offset = off_mem_rsvmap
          index = 0

          while offset + 16 <= len(data):

              address, size = struct.unpack(
                  ">QQ",
                  data[offset:offset + 16]
              )

              if address == 0 and size == 0:
                  print("End of reserve map.")
                  break

              print(
                  f"[{index}] "
                  f"address=0x{address:016x} "
                  f"size=0x{size:016x} "
                  f"({size} bytes)"
              )

              offset += 16
              index += 1

          if index == 0:
              print("Keine reservierten Speicherbereiche gefunden.")

          PY

          cat dtb_extraction/memory_reserve_map.txt


      # ============================================================
      # 8. Vollständige DTS erzeugen
      # ============================================================
      - name: Decompile Complete DTB
        run: |
          set -e

          echo "=========================================="
          echo "DECOMPILING DTB"
          echo "=========================================="

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o device_tree.dts \
            rk3326-r36s-type5-linux.dtb

          echo
          echo "Dekomplilierung abgeschlossen."

          ls -lah device_tree.dts

          echo
          echo "Zeilenanzahl:"
          wc -l device_tree.dts

          echo
          echo "=========================================="
          echo "ERSTE 80 ZEILEN"
          echo "=========================================="

          head -n 80 device_tree.dts


      # ============================================================
      # 9. DTS in Extraction kopieren
      # ============================================================
      - name: Save Decompiled DTS
        run: |
          set -e

          cp \
            device_tree.dts \
            dtb_extraction/device_tree.dts

          echo "DTS gespeichert."


      # ============================================================
      # 10. DTS mit verschiedenen dtc Optionen erzeugen
      # ============================================================
      - name: Create Additional DTS Versions
        run: |
          set -e

          echo "Erzeuge zusätzliche DTS-Versionen..."

          dtc \
            -I dtb \
            -O dts \
            -o dtb_extraction/device_tree_plain.dts \
            rk3326-r36s-type5-linux.dtb

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o dtb_extraction/device_tree_symbols.dts \
            rk3326-r36s-type5-linux.dtb

          echo
          echo "Erzeugte DTS-Dateien:"
          ls -lh dtb_extraction/*.dts


      # ============================================================
      # 11. DTB Strings extrahieren
      # ============================================================
      - name: Extract DTB Strings
        run: |
          set -e

          strings \
            -a \
            -n 2 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_strings.txt

          echo "Strings extrahiert."

          echo
          echo "Anzahl Strings:"
          wc -l dtb_extraction/dtb_strings.txt


      # ============================================================
      # 12. Vollständiger Hexdump
      # ============================================================
      - name: Create Complete Hex Dump
        run: |
          set -e

          xxd \
            -g 1 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_complete_hex.txt

          echo "Kompletter Hexdump erstellt."

          ls -lh \
            dtb_extraction/dtb_complete_hex.txt


      # ============================================================
      # 13. Header Hexdump
      # ============================================================
      - name: Extract DTB Header Hex
        run: |
          set -e

          xxd \
            -g 1 \
            -l 64 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_header_hex.txt

          cat dtb_extraction/dtb_header_hex.txt


      # ============================================================
      # 14. Structure-Bereich extrahieren
      # ============================================================
      - name: Extract DT Structure Binary
        run: |
          set -e

          python3 <<'PY'

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          (
              magic,
              totalsize,
              off_dt_struct,
              off_dt_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_dt_strings,
              size_dt_struct
          ) = struct.unpack(">10I", data[:40])

          structure = data[
              off_dt_struct:
              off_dt_struct + size_dt_struct
          ]

          with open(
              "dtb_extraction/dt_structure.bin",
              "wb"
          ) as f:
              f.write(structure)

          print(
              f"Structure extrahiert: "
              f"{len(structure)} Bytes"
          )

          PY


      # ============================================================
      # 15. Strings-Bereich extrahieren
      # ============================================================
      - name: Extract DT Strings Binary
        run: |
          set -e

          python3 <<'PY'

          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          (
              magic,
              totalsize,
              off_dt_struct,
              off_dt_strings,
              off_mem_rsvmap,
              version,
              last_comp_version,
              boot_cpuid_phys,
              size_dt_strings,
              size_dt_struct
          ) = struct.unpack(">10I", data[:40])

          strings = data[
              off_dt_strings:
              off_dt_strings + size_dt_strings
          ]

          with open(
              "dtb_extraction/dt_strings.bin",
              "wb"
          ) as f:
              f.write(strings)

          print(
              f"Strings-Bereich extrahiert: "
              f"{len(strings)} Bytes"
          )

          PY


      # ============================================================
      # 16. Structure und Strings als Hexdump
      # ============================================================
      - name: Dump Structure and Strings
        run: |
          set -e

          xxd \
            -g 1 \
            dtb_extraction/dt_structure.bin \
            > dtb_extraction/dt_structure_hex.txt

          xxd \
            -g 1 \
            dtb_extraction/dt_strings.bin \
            > dtb_extraction/dt_strings_hex.txt


      # ============================================================
      # 17. Hardware-relevante Einträge suchen
      # ============================================================
      - name: Search Hardware Nodes
        run: |
          set +e

          echo "==================================================" \
            > dtb_extraction/hardware_search.txt

          echo "HARDWARE RELATED DTS ENTRIES" \
            >> dtb_extraction/hardware_search.txt

          echo "==================================================" \
            >> dtb_extraction/hardware_search.txt

          echo \
            >> dtb_extraction/hardware_search.txt

          grep -Ein \
            "gpio|gpio-key|gpio-keys|adc|adc-keys|joystick|joy|analog|key|keys|button|input|pinctrl|rk3326|rk817|rk8xx|rockchip" \
            device_tree.dts \
            >> dtb_extraction/hardware_search.txt

          echo
          echo "Hardware-Suche abgeschlossen."

          cat dtb_extraction/hardware_search.txt


      # ============================================================
      # 18. Spezifische Suche nach FN / Funktionstaste
      # ============================================================
      - name: Search FN Button
        run: |
          set +e

          {
            echo "=================================================="
            echo "FN / FUNCTION BUTTON SEARCH"
            echo "=================================================="
            echo

            grep -Ein \
              "fn|function|func|menu|select|start|hotkey" \
              device_tree.dts

            echo
            echo "=================================================="
            echo "GPIO KEY SEARCH"
            echo "=================================================="

            grep -Ein \
              "gpio-keys|gpio-key|linux,code|linux,input|keycode" \
              device_tree.dts

            echo
            echo "=================================================="
            echo "ADC KEY SEARCH"
            echo "=================================================="

            grep -Ein \
              "adc-keys|adc|io-channel|channel" \
              device_tree.dts

          } > dtb_extraction/fn_button_search.txt

          cat dtb_extraction/fn_button_search.txt


      # ============================================================
      # 19. Suche nach Joystick / Analogstick
      # ============================================================
      - name: Search Analog Stick
        run: |
          set +e

          {
            echo "=================================================="
            echo "ANALOG / JOYSTICK SEARCH"
            echo "=================================================="
            echo

            grep -Ein \
              "joystick|joy|analog|axis|axes|x-axis|y-axis|adc" \
              device_tree.dts

            echo
            echo "=================================================="
            echo "INPUT DEVICE SEARCH"
            echo "=================================================="

            grep -Ein \
              "input|input-device|linux,input|linux,code" \
              device_tree.dts

            echo
            echo "=================================================="
            echo "GPIO / PINCTRL SEARCH"
            echo "=================================================="

            grep -Ein \
              "gpio|pinctrl|pins|pinmux|pull-up|pull-down" \
              device_tree.dts

          } > dtb_extraction/analog_stick_search.txt

          cat dtb_extraction/analog_stick_search.txt


      # ============================================================
      # 20. Alle Properties mit invert / polarity suchen
      # ============================================================
      - name: Search Polarity and Inversion
        run: |
          set +e

          {
            echo "=================================================="
            echo "POLARITY / INVERSION SEARCH"
            echo "=================================================="
            echo

            grep -Ein 
