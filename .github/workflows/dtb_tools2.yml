
name: Decompile R36S DTB

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Repository auschecken
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Device Tree Compiler installieren
      # ============================================================
      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

          echo "========================================"
          echo "DTC VERSION"
          echo "========================================"

          dtc --version


      # ============================================================
      # 3. Repository prüfen
      # ============================================================
      - name: Check Repository
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"

          pwd

          echo
          echo "========================================"
          echo "REPOSITORY FILES"
          echo "========================================"

          find . -maxdepth 4 -type f -print | sort


      # ============================================================
      # 4. DTB prüfen
      # ============================================================
      - name: Verify DTB
        run: |
          set -e

          DTB="rk3326-r36s-type5-linux.dtb"

          echo "========================================"
          echo "CHECK DTB"
          echo "========================================"

          if [ -f "$DTB" ]; then
            echo "DTB gefunden:"
            ls -lh "$DTB"
          else
            echo
            echo "FEHLER:"
            echo "$DTB wurde nicht gefunden!"
            echo
            echo "Gefundene DTB-Dateien:"
            find . -type f -name "*.dtb" -print
            exit 1
          fi


      # ============================================================
      # 5. Extraktionsverzeichnis erstellen
      # ============================================================
      - name: Create Extraction Directory
        run: |
          set -e

          rm -rf dtb_extraction

          mkdir -p dtb_extraction

          echo "Extraktionsverzeichnis erstellt."


      # ============================================================
      # 6. Original DTB kopieren
      # ============================================================
      - name: Copy Original DTB
        run: |
          set -e

          cp \
            rk3326-r36s-type5-linux.dtb \
            dtb_extraction/rk3326-r36s-type5-linux.original.dtb

          echo "Original-DTB wurde kopiert."

          ls -lh \
            dtb_extraction/rk3326-r36s-type5-linux.original.dtb


      # ============================================================
      # 7. DTB Header analysieren
      # ============================================================
      - name: Analyze DTB Header
        run: |
          set -e

          python3 <<'PY'
          import struct
          import os

          filename = "rk3326-r36s-type5-linux.dtb"
          output = "dtb_extraction/dtb_header.txt"

          filesize = os.path.getsize(filename)

          with open(filename, "rb") as f:
              header = f.read(40)

          if len(header) < 40:
              raise SystemExit("DTB Header ist zu kurz.")

          values = struct.unpack(">10I", header)

          magic = values[0]
          totalsize = values[1]
          off_dt_struct = values[2]
          off_dt_strings = values[3]
          off_mem_rsvmap = values[4]
          version = values[5]
          last_comp_version = values[6]
          boot_cpuid_phys = values[7]
          size_dt_strings = values[8]
          size_dt_struct = values[9]

          structure_end = off_dt_struct + size_dt_struct
          strings_end = off_dt_strings + size_dt_strings

          trailing = filesize - totalsize

          print("========================================")
          print("DEVICE TREE BLOB HEADER")
          print("========================================")
          print()
          print(f"File size          : {filesize} bytes")
          print(f"Magic              : 0x{magic:08x}")
          print(f"Total size         : {totalsize} bytes")
          print(f"Structure offset   : 0x{off_dt_struct:08x}")
          print(f"Strings offset     : 0x{off_dt_strings:08x}")
          print(f"Reserve map offset : 0x{off_mem_rsvmap:08x}")
          print(f"Version            : {version}")
          print(f"Last compatible    : {last_comp_version}")
          print(f"Boot CPU           : {boot_cpuid_phys}")
          print(f"Strings size       : {size_dt_strings} bytes")
          print(f"Structure size     : {size_dt_struct} bytes")
          print()
          print(f"Structure end      : 0x{structure_end:08x}")
          print(f"Strings end        : 0x{strings_end:08x}")
          print(f"Trailing data      : {trailing} bytes")

          if magic != 0xd00dfeed:
              raise SystemExit(
                  f"Ungültige DTB Magic: 0x{magic:08x}"
              )

          with open(output, "w") as out:
              out.write("DEVICE TREE BLOB HEADER\n")
              out.write("========================\n\n")
              out.write(f"File size: {filesize} bytes\n")
              out.write(f"Magic: 0x{magic:08x}\n")
              out.write(f"Total size: {totalsize} bytes\n")
              out.write(
                  f"Structure offset: 0x{off_dt_struct:08x}\n"
              )
              out.write(
                  f"Strings offset: 0x{off_dt_strings:08x}\n"
              )
              out.write(
                  f"Reserve map offset: 0x{off_mem_rsvmap:08x}\n"
              )
              out.write(f"Version: {version}\n")
              out.write(
                  f"Last compatible: {last_comp_version}\n"
              )
              out.write(
                  f"Boot CPU: {boot_cpuid_phys}\n"
              )
              out.write(
                  f"Strings size: {size_dt_strings} bytes\n"
              )
              out.write(
                  f"Structure size: {size_dt_struct} bytes\n"
              )
              out.write(
                  f"Structure end: 0x{structure_end:08x}\n"
              )
              out.write(
                  f"Strings end: 0x{strings_end:08x}\n"
              )
              out.write(
                  f"Trailing data: {trailing} bytes\n"
              )

          PY

          echo
          cat dtb_extraction/dtb_header.txt


      # ============================================================
      # 8. Memory Reserve Map extrahieren
      # ============================================================
      - name: Extract Memory Reserve Map
        run: |
          set -e

          python3 <<'PY' > dtb_extraction/memory_reserve_map.txt
          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_mem_rsvmap = header[4]

          print("DEVICE TREE MEMORY RESERVE MAP")
          print("==============================")
          print()
          print(
              f"Reserve map offset: "
              f"0x{off_mem_rsvmap:08x}"
          )
          print()

          offset = off_mem_rsvmap
          index = 0

          while offset + 16 <= len(data):

              address, size = struct.unpack(
                  ">QQ",
                  data[offset:offset + 16]
              )

              if address == 0 and size == 0:
                  print("End of reserve map.")
                  break

              print(
                  f"[{index}] "
                  f"address=0x{address:016x} "
                  f"size=0x{size:016x} "
                  f"({size} bytes)"
              )

              offset += 16
              index += 1

          if index == 0:
              print("Keine reservierten Bereiche gefunden.")

          PY

          cat dtb_extraction/memory_reserve_map.txt


      # ============================================================
      # 9. KOMPLETTE DTB DEKOMPILIEREN
      # ============================================================
      - name: Decompile Complete DTB
        run: |
          set -e

          echo "========================================"
          echo "DECOMPILING DTB"
          echo "========================================"

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o device_tree.dts \
            rk3326-r36s-type5-linux.dtb

          echo
          echo "Dekomplilierung erfolgreich."

          echo
          echo "DTS Datei:"
          ls -lh device_tree.dts

          echo
          echo "DTS Zeilen:"
          wc -l device_tree.dts


      # ============================================================
      # 10. DTS speichern
      # ============================================================
      - name: Save Decompiled DTS
        run: |
          set -e

          cp \
            device_tree.dts \
            dtb_extraction/device_tree.dts

          echo "device_tree.dts gespeichert."


      # ============================================================
      # 11. DTS OHNE Symbols erzeugen
      # ============================================================
      - name: Create Plain DTS
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -o dtb_extraction/device_tree_plain.dts \
            rk3326-r36s-type5-linux.dtb

          echo "Plain DTS erzeugt."


      # ============================================================
      # 12. DTS MIT Symbols erzeugen
      # ============================================================
      - name: Create Symbol DTS
        run: |
          set -e

          dtc \
            -I dtb \
            -O dts \
            -@ \
            -o dtb_extraction/device_tree_symbols.dts \
            rk3326-r36s-type5-linux.dtb

          echo "Symbol DTS erzeugt."


      # ============================================================
      # 13. DTB Strings extrahieren
      # ============================================================
      - name: Extract Strings
        run: |
          set -e

          strings \
            -a \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_strings.txt

          echo "Strings extrahiert."

          wc -l \
            dtb_extraction/dtb_strings.txt


      # ============================================================
      # 14. Vollständiger Hexdump
      # ============================================================
      - name: Create Hex Dump
        run: |
          set -e

          xxd \
            -g 1 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_complete_hex.txt

          echo "Hexdump erstellt."


      # ============================================================
      # 15. DTB Header Hexdump
      # ============================================================
      - name: Create Header Hex Dump
        run: |
          set -e

          xxd \
            -g 1 \
            -l 64 \
            rk3326-r36s-type5-linux.dtb \
            > dtb_extraction/dtb_header_hex.txt

          cat dtb_extraction/dtb_header_hex.txt


      # ============================================================
      # 16. Structure-Bereich extrahieren
      # ============================================================
      - name: Extract Structure Block
        run: |
          set -e

          python3 <<'PY'
          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_dt_struct = header[2]
          size_dt_struct = header[9]

          structure = data[
              off_dt_struct:
              off_dt_struct + size_dt_struct
          ]

          with open(
              "dtb_extraction/dt_structure.bin",
              "wb"
          ) as f:
              f.write(structure)

          print(
              "Structure Block:",
              len(structure),
              "bytes"
          )

          PY


      # ============================================================
      # 17. Strings-Bereich extrahieren
      # ============================================================
      - name: Extract Strings Block
        run: |
          set -e

          python3 <<'PY'
          import struct

          filename = "rk3326-r36s-type5-linux.dtb"

          with open(filename, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          off_dt_strings = header[3]
          size_dt_strings = header[8]

          strings_block = data[
              off_dt_strings:
              off_dt_strings + size_dt_strings
          ]

          with open(
              "dtb_extraction/dt_strings.bin",
              "wb"
          ) as f:
              f.write(strings_block)

          print(
              "Strings Block:",
              len(strings_block),
              "bytes"
          )

          PY


      # ============================================================
      # 18. Structure Hexdump
      # ============================================================
      - name: Dump Structure Block
        run: |
          set -e

          xxd \
            -g 1 \
            dtb_extraction/dt_structure.bin \
            > dtb_extraction/dt_structure_hex.txt

          echo "Structure Hexdump erstellt."


      # ============================================================
      # 19. Strings Hexdump
      # ============================================================
      - name: Dump Strings Block
        run: |
          set -e

          xxd \
            -g 1 \
            dtb_extraction/dt_strings.bin \
            > dtb_extraction/dt_strings_hex.txt

          echo "Strings Hexdump erstellt."


      # ============================================================
      # 20. Hardware-Suche
      # ============================================================
      - name: Search Hardware
        run: |
          set +e

          echo "HARDWARE SEARCH" \
            > dtb_extraction/hardware_search.txt

          echo "===============" \
            >> dtb_extraction/hardware_search.txt

          echo "" \
            >> dtb_extraction/hardware_search.txt

          grep -Ein \
            "gpio|adc|joystick|joy|analog|key|keys|button|input|pinctrl|rk3326" \
            device_tree.dts \
            >> dtb_extraction/hardware_search.txt || true

          echo
          cat dtb_extraction/hardware_search.txt


      # ============================================================
      # 21. FN Button Suche
      # ============================================================
      - name: Search FN Button
        run: |
          set +e

          echo "FN BUTTON SEARCH" \
            > dtb_extraction/fn_button_search.txt

          echo "================" \
            >> dtb_extraction/fn_button_search.txt

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "FN / FUNCTION / MENU:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "fn|function|func|menu|hotkey" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt || true

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "GPIO KEYS:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "gpio-keys|gpio-key|linux,code|keycode" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt || true

          echo "" \
            >> dtb_extraction/fn_button_search.txt

          echo "ADC KEYS:" \
            >> dtb_extraction/fn_button_search.txt

          grep -Ein \
            "adc-keys|io-channels|io-channel|adc" \
            device_tree.dts \
            >> dtb_extraction/fn_button_search.txt || true

          echo
          cat dtb_extraction/fn_button_search.txt


      # ============================================================
      # 22. Analogstick Suche
      # ============================================================
      - name: Search Analog Stick
        run: |
          set +e

          echo "ANALOG STICK SEARCH" \
            > dtb_extraction/analog_stick_search.txt

          echo "===================" \
            >> dtb_extraction/analog_stick_search.txt

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "JOYSTICK / ANALOG:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "joystick|joy|analog|axis|axes|x-axis|y-axis" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt || true

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "ADC:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "adc|adc@|adc-" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt || true

          echo "" \
            >> dtb_extraction/analog_stick_search.txt

          echo "INPUT:" \
            >> dtb_extraction/analog_stick_search.txt

          grep -Ein \
            "input|input-device|linux,input" \
            device_tree.dts \
            >> dtb_extraction/analog_stick_search.txt || true

          echo
          cat dtb_extraction/analog_stick_search.txt


      # ============================================================
      # 23. Polarity / Inversion
      # ============================================================
      - name: Search Polarity And Inversion
        run: |
          set +e

          echo "POLARITY AND INVERSION SEARCH" \
            > dtb_extraction/polarity_search.txt

          echo "=============================" \
            >> dtb_extraction/polarity_search.txt

          echo "" \
            >> dtb_extraction/polarity_search.txt

          grep -Ein \
            "invert|inverted|polarity|active-low|active-high|axis" \
            device_tree.dts \
            >> dtb_extraction/polarity_search.txt || true

          echo
          cat dtb_extraction/polarity_search.txt


      # ============================================================
      # 24. Alle GPIO Einträge
      # ============================================================
      - name: Extract GPIO Entries
        run: |
          set +e

          grep -Ein \
            "gpio" \
            device_tree.dts \
            > dtb_extraction/all_gpio_entries.txt || true

          echo "GPIO entries:"
          cat dtb_extraction/all_gpio_entries.txt


      # ============================================================
      # 25. Alle ADC Einträge
      # ============================================================
      - name: Extract ADC Entries
        run: |
          set +e

          grep -Ein \
            "adc" \
            device_tree.dts \
            > dtb_extraction/all_adc_entries.txt || true

          echo "ADC entries:"
          cat dtb_extraction/all_adc_entries.txt


      # ============================================================
      # 26. Alle Input / Key Einträge
      # ============================================================
      - name: Extract Input Entries
        run: |
