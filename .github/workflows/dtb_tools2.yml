name: Decompile k36 DTB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Ermöglicht manuelles Starten über den GitHub "Actions"-Tab

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Verify and Decompile DTB
        run: |
          # Prüfen ob die Datei existiert (verhindert 'No such file' Fehler)
          if [ -f "rk3326-r36s-type5-linux.dtb" ]; then
            echo "Datei gefunden, starte Dekompilierung..."
            dtc -I dtb -O dts -o device_tree.dts rk3326-r36s-type5-linux.dtb
          else
            echo "Fehler: rk3326-r36s-type5-linux.dtb nicht im Root gefunden!"
            exit 1
          fi

      - name: Diagnose original padding (optional, fuer spaetere Compile-Schritte)
        run: |
          echo "=== Original DTB Groesse ==="
          ls -la rk3326-r36s-type5-linux.dtb

          echo "=== Header-Felder (totalsize, size_dt_struct, size_dt_strings) ==="
          # Header ist big-endian uint32 ab Byte 0. Relevante Felder:
          # Byte  4- 7: totalsize
          # Byte 36-39: size_dt_struct
          # Byte 40-43: size_dt_strings
          python3 -c "
          import struct
          with open('rk3326-r36s-type5-linux.dtb', 'rb') as f:
              data = f.read(40)
          magic, totalsize, off_struct, off_strings, off_mem_rsvmap, version, last_comp_version, boot_cpuid, size_strings, size_struct = struct.unpack('>10I', data)
          print(f'totalsize        = {totalsize} Bytes')
          print(f'size_dt_struct   = {size_struct} Bytes')
          print(f'size_dt_strings  = {size_strings} Bytes')
          used = off_struct + size_struct  # grobe Untergrenze des tatsaechlich genutzten Bereichs
          slack = totalsize - used
          print(f'Geschaetzter Leerraum (Padding) im Original: ~{slack} Bytes')
          print(f'--> Empfehlung fuer -p Flag beim Compile-Workflow: mindestens {max(slack, 0)} (z.B. auf naechste 0x100-Grenze aufrunden)')
          "

      - name: Upload DTS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-dts
          path: device_tree.dts
