name: rg32tw3ka DTB Complete Extraction

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  extract-dtb:
    name: Decompile and Extract rg32tw3ka DTB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler zip xxd file binwalk
          
          echo "========================================"
          echo "DTC VERSION"
          echo "========================================"
          dtc --version

      - name: Extract and decompile DTB
        run: |
          set -euo pipefail
          
          echo "========================================"
          echo "rg32tw3ka DTB EXTRACTION"
          echo "========================================"
          
          OUTPUT="rg32tw3ka_dtb_complete"
          DTB="rg32tw3ka.dtb"
          
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          
          echo ""
          echo "Searching for DTB..."
          echo ""
          
          if [ -f "$DTB" ]; then
            echo "Found expected DTB:"
            echo "$DTB"
          else
            FOUND="$(find . -type f -name '*.dtb' | head -n 1 || true)"
            
            if [ -n "$FOUND" ]; then
              DTB="$FOUND"
              echo "Expected filename was not found."
              echo "Using discovered DTB:"
              echo "$DTB"
            else
              echo "ERROR: No DTB file found."
              echo ""
              find . -type f | sort
              exit 1
            fi
          fi
          
          echo ""
          echo "========================================"
          echo "ORIGINAL DTB"
          echo "========================================"
          
          cp "$DTB" "$OUTPUT/original.dtb"
          ls -lh "$DTB"
          file "$DTB"
          
          echo ""
          echo "========================================"
          echo "RAW DTB HEXDUMP"
          echo "========================================"
          
          xxd -g 1 "$DTB" > "$OUTPUT/dtb_complete_hex.txt"
          
          echo ""
          echo "========================================"
          echo "DTB STRINGS"
          echo "========================================"
          
          strings -a "$DTB" > "$OUTPUT/dtb_strings.txt"
          
          echo ""
          echo "========================================"
          echo "DTB HEADER"
          echo "========================================"
          
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" "$DTB" "$OUTPUT/dtb_header.txt" << 'EOF'
          import sys
          import struct
          import os

          dtb = sys.argv[1]
          output = sys.argv[2]

          with open(dtb, "rb") as f:
              header = f.read(40)

          if len(header) != 40:
              raise SystemExit("DTB header is smaller than 40 bytes")

          values = struct.unpack(">10I", header)

          magic = values[0]
          totalsize = values[1]
          off_struct = values[2]
          off_strings = values[3]
          off_mem_rsvmap = values[4]
          version = values[5]
          last_comp_version = values[6]
          boot_cpuid_phys = values[7]
          size_strings = values[8]
          size_struct = values[9]

          filesize = os.path.getsize(dtb)

          print("DTB HEADER")
          print("==========")
          print()
          print("Magic              :", hex(magic))
          print("Total size         :", totalsize)
          print("Structure offset   :", hex(off_struct))
          print("Strings offset     :", hex(off_strings))
          print("Reserve map offset :", hex(off_mem_rsvmap))
          print("Version            :", version)
          print("Last compatible    :", last_comp_version)
          print("Boot CPU           :", boot_cpuid_phys)
          print("Strings size       :", size_strings)
          print("Structure size     :", size_struct)
          print("Actual file size   :", filesize)

          with open(output, "w") as f:
              f.write("DTB HEADER\n")
              f.write("==========\n\n")
              f.write(f"Magic              : 0x{magic:08x}\n")
              f.write(f"Total size         : {totalsize}\n")
              f.write(f"Structure offset   : 0x{off_struct:08x}\n")
              f.write(f"Strings offset     : 0x{off_strings:08x}\n")
              f.write(f"Reserve map offset : 0x{off_mem_rsvmap:08x}\n")
              f.write(f"Version            : {version}\n")
              f.write(f"Last compatible    : {last_comp_version}\n")
              f.write(f"Boot CPU           : {boot_cpuid_phys}\n")
              f.write(f"Strings size       : {size_strings}\n")
              f.write(f"Structure size     : {size_struct}\n")
              f.write(f"Actual file size   : {filesize}\n")

          if magic != 0xD00DFEED:
              raise SystemExit("Invalid DTB magic: 0x%08x" % magic)
          EOF
          
          echo ""
          echo "========================================"
          echo "DECOMPILING DTB"
          echo "========================================"
          
          if dtc -I dtb -O dts -o "$OUTPUT/device_tree.dts" "$DTB"; then
            echo "Standard DTS decompilation successful."
          else
            echo "ERROR: Standard DTS decompilation failed."
            exit 1
          fi
          
          echo ""
          echo "Creating DTS with symbols..."
          
          if dtc -I dtb -O dts -@ -o "$OUTPUT/device_tree_symbols.dts" "$DTB"; then
            echo "Symbol DTS created."
          else
            echo "Symbol DTS could not be created."
          fi

          echo ""
          echo "========================================"
          echo "FDTDUMP DUMP"
          echo "========================================"

          fdtdump "$DTB" > "$OUTPUT/fdtdump_output.txt" 2>/dev/null || echo "fdtdump failed or had warnings."

          echo ""
          echo "========================================"
          echo "BINWALK DEEP ANALYSIS"
          echo "========================================"
          
          binwalk -e -C "$OUTPUT/binwalk_extracted" "$DTB" > "$OUTPUT/binwalk_report.txt" || true
          
          echo ""
          echo "========================================"
          echo "EXTRACTING DTB STRUCTURE"
          echo "========================================"
          
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" "$DTB" "$OUTPUT" << 'EOF'
          import sys
          import struct

          dtb = sys.argv[1]
          output = sys.argv[2]

          with open(dtb, "rb") as f:
              data = f.read()

          if len(data) < 40:
              raise SystemExit("DTB is too small")

          header = struct.unpack(">10I", data[:40])

          off_struct = header[2]
          off_strings = header[3]
          size_strings = header[8]
          size_struct = header[9]

          structure_end = off_struct + size_struct
          strings_end = off_strings + size_strings

          if structure_end > len(data):
              raise SystemExit("Structure block is outside DTB")

          if strings_end > len(data):
              raise SystemExit("Strings block is outside DTB")

          structure = data[off_struct:structure_end]
          strings_block = data[off_strings:strings_end]

          with open(output + "/dt_structure.bin", "wb") as f:
              f.write(structure)

          with open(output + "/dt_strings.bin", "wb") as f:
              f.write(strings_block)

          with open(output + "/dtb_layout.txt", "w") as f:
              f.write("DTB LAYOUT\n")
              f.write("==========\n\n")
              f.write("Structure offset : 0x%08x\n" % off_struct)
              f.write("Structure size   : %d bytes\n" % size_struct)
              f.write("Structure end    : 0x%08x\n" % structure_end)
              f.write("\n")
              f.write("Strings offset   : 0x%08x\n" % off_strings)
              f.write("Strings size     : %d bytes\n" % size_strings)
              f.write("Strings end      : 0x%08x\n" % strings_end)
              f.write("\n")
              f.write("DTB file size    : %d bytes\n" % len(data))
              f.write("DTB total size   : %d bytes\n" % header[1])

          print("Structure:", len(structure), "bytes")
          print("Strings  :", len(strings_block), "bytes")
          EOF
          
          xxd -g 1 "$OUTPUT/dt_structure.bin" > "$OUTPUT/dt_structure_hex.txt"
          xxd -g 1 "$OUTPUT/dt_strings.bin" > "$OUTPUT/dt_strings_hex.txt"
          
          echo ""
          echo "========================================"
          echo "HARDWARE ANALYSIS"
          echo "========================================"
          
          DTS="$OUTPUT/device_tree.dts"
          
          grep -Ein "gpio|pinctrl|gpio-keys|adc|adc-keys|joystick|joy|analog|axis|axes|button|key|input|linux,code|polarity|invert|inverted|active-low|active-high" "$DTS" > "$OUTPUT/hardware_search.txt" || true
          grep -Ein "fn|function|func|menu|hotkey" "$DTS" > "$OUTPUT/fn_button_search.txt" || true
          grep -Ein "joystick|joy|analog|axis|axes|x-axis|y-axis|adc" "$DTS" > "$OUTPUT/analog_stick_search.txt" || true
          grep -Ein "invert|inverted|polarity|active-low|active-high|axis|axes" "$DTS" > "$OUTPUT/polarity_axis_search.txt" || true
          grep -Ein "gpio" "$DTS" > "$OUTPUT/all_gpio_entries.txt" || true
          grep -Ein "adc" "$DTS" > "$OUTPUT/all_adc_entries.txt" || true
          grep -Ein "input|key|button|event" "$DTS" > "$OUTPUT/all_input_entries.txt" || true
          grep -Ein "compatible" "$DTS" > "$OUTPUT/all_compatible_entries.txt" || true
          
          echo ""
          echo "========================================"
          echo "MEMORY RESERVE MAP"
          echo "========================================"
          
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" "$DTB" "$OUTPUT/memory_reserve_map.txt" << 'EOF'
          import sys
          import struct

          dtb = sys.argv[1]
          output = sys.argv[2]

          with open(dtb, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])
          offset = header[4]

          with open(output, "w") as out:
              out.write("MEMORY RESERVE MAP\n")
              out.write("==================\n\n")

              index = 0
              while offset + 16 <= len(data):
                  address, size = struct.unpack(">QQ", data[offset:offset + 16])

                  if address == 0 and size == 0:
                      out.write("End of reserve map.\n")
                      break

                  out.write("[%d] address=0x%016x size=0x%016x (%d bytes)\n" % (index, address, size, size))
                  offset += 16
                  index += 1
          EOF
          
          echo ""
          echo "========================================"
          echo "PADDING ANALYSIS"
          echo "========================================"
          
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" "$DTB" "$OUTPUT/padding_analysis.txt" << 'EOF'
          import sys
          import struct
          import os

          dtb = sys.argv[1]
          output = sys.argv[2]

          with open(dtb, "rb") as f:
              data = f.read()

          header = struct.unpack(">10I", data[:40])

          totalsize = header[1]
          off_struct = header[2]
          off_strings = header[3]
          size_strings = header[8]
          size_struct = header[9]

          filesize = os.path.getsize(dtb)

          structure_end = off_struct + size_struct
          strings_end = off_strings + size_strings
          used_end = max(structure_end, strings_end)

          padding = totalsize - used_end
          trailing = filesize - totalsize

          with open(output, "w") as out:
              out.write("PADDING ANALYSIS\n")
              out.write("================\n\n")
              out.write("File size      : %d\n" % filesize)
              out.write("DTB total size : %d\n" % totalsize)
              out.write("Structure end  : 0x%x\n" % structure_end)
              out.write("Strings end    : 0x%x\n" % strings_end)
              out.write("Used end       : 0x%x\n" % used_end)
              out.write("DTB padding    : %d bytes\n" % padding)
              out.write("Trailing data  : %d bytes\n" % trailing)

          print("Padding:", padding)
          print("Trailing:", trailing)
          EOF
          
          echo ""
          echo "========================================"
          echo "CREATING README"
          echo "========================================"
          
          {
            echo "rg32tw3ka DTB COMPLETE EXTRACTION"
            echo "================================="
            echo ""
            echo "Original DTB:"
            echo "$DTB"
            echo ""
            echo "Generated files:"
            find "$OUTPUT" -type f -printf "%f - %s bytes\n" | sort
            echo ""
            echo "Total output size:"
            du -sh "$OUTPUT"
          } > "$OUTPUT/README.txt"
          
          echo ""
          echo "========================================"
          echo "EXTRACTION COMPLETE"
          echo "========================================"
          
          find "$OUTPUT" -type f -printf "%p (%s bytes)\n" | sort

      - name: Create ZIP
        if: always()
        run: |
          set -euo pipefail
          
          echo "========================================"
          echo "CREATING ZIP"
          echo "========================================"
          
          if [ ! -d "rg32tw3ka_dtb_complete" ]; then
            echo "ERROR: Output directory does not exist."
            exit 1
          fi
          
          rm -f rg32tw3ka-dtb-complete.zip
          zip -r rg32tw3ka-dtb-complete.zip rg32tw3ka_dtb_complete
          
          echo ""
          echo "ZIP CREATED:"
          ls -lh rg32tw3ka-dtb-complete.zip
          
          echo ""
          echo "ZIP CONTENT:"
          unzip -l rg32tw3ka-dtb-complete.zip

      - name: Verify ZIP
        if: always()
        run: |
          set -euo pipefail
          
          if [ ! -f "rg32tw3ka-dtb-complete.zip" ]; then
            echo "ERROR: ZIP does not exist."
            exit 1
          fi
          
          echo "Testing ZIP..."
          unzip -t rg32tw3ka-dtb-complete.zip
          
          echo ""
          echo "ZIP TEST SUCCESSFUL."

      - name: Upload complete DTB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg32tw3ka-DTB-COMPLETE
          path: rg32tw3ka-dtb-complete.zip
          if-no-files-found: error
          retention-days: 30
